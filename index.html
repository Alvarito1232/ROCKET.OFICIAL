<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKET - Plataforma de Servicios</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Outfit / Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09070d',
                        purpleGlow: '#9d4edd',
                        softViolet: '#7b2cbf',
                        lightPinkGlow: '#e0aaff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09070d;
            color: #f3e8ff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. Fondo Principal Encajado Perfectamente con Filtro de Color Sutil (Inspirado en Foto 3) */
        .bg-main-wrapper {
            background-image: 
                linear-gradient(180deg, rgba(9, 7, 13, 0.72) 0%, rgba(15, 10, 24, 0.85) 100%),
                url('Fondoprincipal.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Fallback de imagen en vivo por si no se localiza en servidor local */
        .bg-main-fallback {
            background-image: 
                linear-gradient(180deg, rgba(9, 7, 13, 0.72) 0%, rgba(15, 10, 24, 0.88) 100%),
                url('Fondoprincipal.jpg'),
                url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* 2. Cuadro Neón ROCKET Elegante y Sobrio */
        .rocket-frame {
            background: rgba(18, 12, 28, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(168, 85, 247, 0.45);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(157, 78, 221, 0.25),
                inset 0 0 15px rgba(168, 85, 247, 0.15);
            border-radius: 20px;
        }

        /* Fondo interno del cuadro de ROCKET */
        .rocket-inner-bg {
            background-image: 
                linear-gradient(180deg, rgba(25, 15, 38, 0.55) 0%, rgba(12, 7, 20, 0.75) 100%),
                url('fondorocket.jpg'),
                url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center 30%;
        }

        /* Brillo sutil y sobrio de las letras ROCKET (Sin exagerar/saturar) */
        .subtle-title-glow {
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.8),
                0 0 18px rgba(192, 132, 252, 0.45);
        }

        /* 3. Estilo Minimalista Pro de Carga (Estilo Imagen 2) */
        .loading-title {
            letter-spacing: 0.45em;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .minimal-track {
            background: rgba(255, 255, 255, 0.15);
            height: 2px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .minimal-fill {
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff, 0 0 15px rgba(224, 170, 255, 0.8);
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.05s linear;
        }

        .percent-text {
            letter-spacing: 0.25em;
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Montserrat', sans-serif;
        }

        /* Cartillas de servicios */
        .glass-card {
            background: rgba(18, 12, 28, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            transition: all 0.35s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(224, 170, 255, 0.6);
            box-shadow: 0 10px 25px -5px rgba(157, 78, 221, 0.4);
        }

        .cartilla-header-img {
            background-image: 
                linear-gradient(180deg, rgba(9, 7, 13, 0.1) 0%, rgba(9, 7, 13, 0.9) 100%),
                url('imagencartillas.jpg'),
                url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Ocultar barra de desplazamiento */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09070d; }
        ::-webkit-scrollbar-thumb { background: #3c096c; border-radius: 3px; }
    </style>
</head>
<body class="bg-main-fallback min-h-screen text-slate-100 flex flex-col antialiased selection:bg-purple-600 selection:text-white">

    <!-- 1. PANTALLA DE CARGA (SPLASH SCREEN MINIMALISTA PRO - 2 SEGUNDOS) -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 transition-opacity duration-700 ease-out">
        
        <div class="w-full max-w-xl flex flex-col items-center">
            
            <!-- Cuadro Neón Rocket (Unicamente dice ROCKET) -->
            <div class="rocket-frame rocket-inner-bg px-10 py-7 sm:px-16 sm:py-9 w-full text-center relative overflow-hidden mb-12">
                <div class="relative z-10 flex items-center justify-center gap-3 sm:gap-4">
                    <span class="text-3xl sm:text-5xl select-none" role="img" aria-label="rocket">🚀</span>
                    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-widest text-white subtle-title-glow font-display uppercase">
                        ROCKET
                    </h1>
                </div>
            </div>

            <!-- Indicador de Carga Estilo Minimalista Pro (Imagen 2) -->
            <div class="w-full max-w-sm flex flex-col items-center space-y-4">
                
                <!-- Palabra LOADING -->
                <span class="loading-title font-display uppercase">LOADING</span>

                <!-- Línea Fina de Carga -->
                <div class="minimal-track">
                    <div id="progress-bar" class="minimal-fill"></div>
                </div>

                <!-- Porcentaje 0 % - 100 % -->
                <span id="progress-percentage" class="percent-text">0 %</span>

            </div>

        </div>
    </div>

    <!-- 2. PÁGINA PRINCIPAL DE SERVICIOS (Aparece automáticamente tras cargar) -->
    <div id="main-content" class="min-h-screen opacity-0 transition-opacity duration-1000 ease-in hidden flex flex-col">
        
        <!-- Navbar Minimalista -->
        <header class="sticky top-0 z-40 bg-black/60 backdrop-blur-md border-b border-purple-500/20 px-6 py-4">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                
                <div class="flex items-center space-x-2 cursor-pointer" onclick="filterServices('all')">
                    <span class="text-xl">🚀</span>
                    <span class="font-display font-extrabold text-xl tracking-widest text-white">ROCKET</span>
                </div>

                <nav class="hidden md:flex items-center space-x-6 text-xs font-semibold tracking-wider text-purple-200/80">
                    <button onclick="filterServices('all')" class="hover:text-white transition">TODOS</button>
                    <button onclick="filterServices('digital')" class="hover:text-white transition">DIGITALES</button>
                    <button onclick="filterServices('osint')" class="hover:text-white transition">OSINT</button>
                    <button onclick="filterServices('academic')" class="hover:text-white transition">ACADÉMICOS</button>
                </nav>

                <button onclick="openContactModal()" class="px-4 py-2 rounded-lg text-xs font-bold bg-white/10 hover:bg-white/20 border border-white/20 text-white transition">
                    Contacto
                </button>
            </div>
        </header>

        <!-- Hero Banner -->
        <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-10">
            
            <div class="relative rounded-2xl overflow-hidden mb-10 p-8 sm:p-12 border border-purple-500/20 bg-black/40 backdrop-blur-md">
                <div class="relative z-10 max-w-2xl">
                    <span class="inline-block px-3 py-1 rounded-full text-[10px] font-semibold tracking-widest bg-purple-500/20 text-purple-200 border border-purple-500/30 mb-3">
                        CATÁLOGO OFICIAL
                    </span>
                    <h2 class="text-2xl sm:text-4xl font-bold text-white font-display mb-3">
                        Servicios & Soluciones
                    </h2>
                    <p class="text-purple-200/80 text-xs sm:text-sm mb-6 leading-relaxed">
                        Explora nuestra gama de soluciones digitales, análisis de inteligencia OSINT y acompañamiento académico.
                    </p>
                    
                    <div class="relative max-w-md">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-purple-400/60 text-xs"></i>
                        <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Buscar servicio..." 
                            class="w-full pl-9 pr-4 py-2.5 bg-black/60 border border-purple-500/30 rounded-xl text-xs text-white placeholder-purple-300/40 focus:outline-none focus:border-purple-400 transition">
                    </div>
                </div>
            </div>

            <!-- Grilla de Cartillas -->
            <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dinámico -->
            </div>

            <div id="no-results" class="hidden text-center py-12 bg-black/40 border border-purple-500/20 rounded-xl">
                <p class="text-xs text-purple-300/60">No se encontraron resultados para la búsqueda.</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-purple-500/10 bg-black/60 py-6 px-6 text-center text-xs text-purple-300/50">
            &copy; 2026 ROCKET. Plataforma de Servicios Digitales.
        </footer>
    </div>

    <!-- Modal Contacto -->
    <div id="contact-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-black/90 border border-purple-500/40 p-6 rounded-2xl max-w-sm w-full relative">
            <button onclick="closeContactModal()" class="absolute top-4 right-4 text-purple-400 hover:text-white text-sm">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold text-white mb-4 font-display">Contacto Directo</h3>
            <form onsubmit="handleContactSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-purple-300 mb-1">Nombre</label>
                    <input type="text" required class="w-full bg-white/5 border border-purple-500/30 rounded-lg p-2 text-white focus:outline-none focus:border-purple-400">
                </div>
                <div>
                    <label class="block text-purple-300 mb-1">Mensaje / Requerimiento</label>
                    <textarea rows="3" required class="w-full bg-white/5 border border-purple-500/30 rounded-lg p-2 text-white focus:outline-none focus:border-purple-400"></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg text-xs font-bold bg-purple-600 hover:bg-purple-500 text-white transition">
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <script>
        const servicesData = [
            { id: 1, category: 'digital', categoryLabel: 'Digital', title: 'Desarrollo Web Cyberpunk', icon: 'fa-code', description: 'Interfaces modernas con diseño responsive y alta velocidad.', time: '3 - 5 días' },
            { id: 2, category: 'digital', categoryLabel: 'Digital', title: 'Ciberseguridad & Auditoría', icon: 'fa-shield-halved', description: 'Evaluación de seguridad y protección de activos digitales.', time: '2 - 4 días' },
            { id: 3, category: 'digital', categoryLabel: 'Digital', title: 'Bots & Automatización', icon: 'fa-robot', description: 'Scripts automatizados para Telegram, Discord y pasarelas.', time: '1 - 3 días' },
            { id: 4, category: 'osint', categoryLabel: 'OSINT', title: 'Investigación & Rastreo OSINT', icon: 'fa-user-secret', description: 'Análisis de huella digital y búsqueda en fuentes abiertas.', time: '24 - 48 hrs' },
            { id: 5, category: 'osint', categoryLabel: 'OSINT', title: 'Auditoría de Exposición Digital', icon: 'fa-magnifying-glass-chart', description: 'Monitoreo de filtraciones e información pública expuesta.', time: '2 - 3 días' },
            { id: 6, category: 'academic', categoryLabel: 'Académico', title: 'Asesoría Académica de Tesis', icon: 'fa-graduation-cap', description: 'Acompañamiento integral, estructura y formato APA/Vancouver.', time: 'A convenir' }
        ];

        function renderServices(filter = 'all', query = '') {
            const grid = document.getElementById('services-grid');
            const noResults = document.getElementById('no-results');
            grid.innerHTML = '';

            const filtered = servicesData.filter(item => {
                const matchFilter = filter === 'all' || item.category === filter;
                const matchQuery = item.title.toLowerCase().includes(query.toLowerCase()) || item.description.toLowerCase().includes(query.toLowerCase());
                return matchFilter && matchQuery;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(service => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl overflow-hidden flex flex-col justify-between cursor-pointer group';
                card.onclick = () => openContactModal();

                card.innerHTML = `
                    <div class="h-24 cartilla-header-img p-4 flex items-start justify-between relative">
                        <div class="w-8 h-8 rounded-lg bg-black/60 border border-purple-400/40 flex items-center justify-center text-purple-300 text-xs">
                            <i class="fa-solid ${service.icon}"></i>
                        </div>
                        <span class="text-[9px] uppercase font-semibold text-purple-200 px-2 py-0.5 rounded bg-black/70 border border-purple-500/30">
                            ${service.categoryLabel}
                        </span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h4 class="text-sm font-bold text-white mb-1 group-hover:text-purple-300 transition">${service.title}</h4>
                            <p class="text-xs text-purple-200/70 leading-relaxed mb-3">${service.description}</p>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-purple-500/20 text-[11px] text-purple-300/80">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${service.time}</span>
                            <span class="font-semibold text-white">Solicitar <i class="fa-solid fa-arrow-right text-[9px]"></i></span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterServices(cat) {
            const query = document.getElementById('search-input').value;
            renderServices(cat, query);
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value;
            renderServices('all', query);
        }

        function openContactModal() { document.getElementById('contact-modal').classList.remove('hidden'); }
        function closeContactModal() { document.getElementById('contact-modal').classList.add('hidden'); }
        function handleContactSubmit(e) {
            e.preventDefault();
            closeContactModal();
            alert("¡Mensaje enviado con éxito!");
        }

        // LÓGICA DE CARGA MINIMALISTA PRO (2 SEGUNDOS EXACTOS)
        const loadingDuration = 2000;
        let startTime = null;

        function updateLoadingProgress(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / loadingDuration, 1);
            const percentage = Math.floor(progress * 100);

            const progressBar = document.getElementById('progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');

            if (progressBar) progressBar.style.width = `${percentage}%`;
            if (progressPercentage) progressPercentage.textContent = `${percentage} %`;

            if (progress < 1) {
                requestAnimationFrame(updateLoadingProgress);
            } else {
                setTimeout(() => {
                    const loadingScreen = document.getElementById('loading-screen');
                    const mainContent = document.getElementById('main-content');

                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.pointerEvents = 'none';

                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        mainContent.classList.remove('hidden');
                        requestAnimationFrame(() => {
                            mainContent.classList.remove('opacity-0');
                            mainContent.classList.add('opacity-100');
                        });
                        renderServices('all');
                    }, 600);
                }, 150);
            }
        }

        window.onload = function() {
            requestAnimationFrame(updateLoadingProgress);
        };
    </script>
</body>
</html>
