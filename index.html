<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKET - Cargando...</title>
    <!-- Font Awesome para iconos si se requiere -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0612;
            color: #ffffff;
            overflow: hidden;
        }

        /* Fondo principal con efecto de desenfoque y viñeta */
        .bg-cyberpunk {
            background-image: 
                radial-gradient(circle at center, rgba(38, 16, 62, 0.7) 0%, rgba(11, 6, 18, 0.95) 100%),
                url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Resplandor Neón Morado / Púrpura */
        .neon-box {
            background: rgba(18, 10, 31, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(168, 85, 247, 0.6);
            box-shadow: 
                0 0 15px rgba(168, 85, 247, 0.3),
                inset 0 0 15px rgba(168, 85, 247, 0.2);
            transition: all 0.3s ease;
        }

        .neon-box:hover {
            box-shadow: 
                0 0 25px rgba(168, 85, 247, 0.5),
                inset 0 0 20px rgba(168, 85, 247, 0.3);
            border-color: rgba(192, 132, 252, 0.9);
        }

        /* Texto brillante de neón */
        .neon-text-white {
            text-shadow: 
                0 0 5px rgba(255, 255, 255, 0.8),
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(168, 85, 247, 0.8),
                0 0 35px rgba(168, 85, 247, 0.6);
        }

        /* Barra de carga animada */
        .progress-bar-fill {
            background: linear-gradient(90deg, #a855f7, #ec4899, #c084fc);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
            transition: width 0.05s linear;
        }

        /* Imagen de fondo dentro de la tarjeta */
        .card-bg-girl {
            background-image: 
                linear-gradient(180deg, rgba(18, 10, 31, 0.7) 0%, rgba(18, 10, 31, 0.85) 100%),
                url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center 30%;
        }

        /* Animación de entrada suave */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animación de pulso para el logo */
        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .rocket-bounce {
            animation: subtlePulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-cyberpunk min-h-screen flex flex-col items-center justify-center p-4 relative">

    <div id="splash-container" class="w-full max-w-3xl flex flex-col items-center z-10 animate-fade-in">
        
        <!-- Tarjeta Principal con Neon y Chica de Fondo -->
        <div class="card-bg-girl neon-box rounded-2xl p-8 sm:p-10 w-full text-center relative overflow-hidden mb-8">
            
            <!-- Contenido de la Tarjeta -->
            <div class="relative z-10 flex flex-col items-center justify-center">
                
                <!-- Encabezado con Cohete y Título ROCKET -->
                <div class="flex items-center justify-center gap-3 mb-3">
                    <span class="text-3xl sm:text-5xl rocket-bounce" role="img" aria-label="rocket">🚀</span>
                    <h1 class="text-4xl sm:text-6xl font-black tracking-widest text-white neon-text-white uppercase">
                        ROCKET
                    </h1>
                </div>

                <!-- Subtítulo / Descripción -->
                <p class="text-xs sm:text-sm md:text-base text-gray-200 font-medium max-w-xl leading-relaxed tracking-wide opacity-90 drop-shadow-md">
                    Plataforma Integral de Servicios Digitales, Inteligencia OSINT & Soluciones Académicas
                </p>
            </div>
            
            <!-- Resplandor ambiental inferior dentro del cuadro -->
            <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-3/4 h-20 bg-purple-600/20 blur-2xl rounded-full pointer-events-none"></div>
        </div>

        <!-- Sección de Carga Inferior -->
        <div class="w-full max-w-md flex flex-col items-center space-y-3">
            
            <!-- Barra de Progreso -->
            <div class="w-full bg-purple-950/60 border border-purple-500/30 rounded-full h-2.5 overflow-hidden p-0.5 backdrop-blur-sm shadow-inner">
                <div id="progress-bar" class="progress-bar-fill h-full rounded-full w-0"></div>
            </div>

            <!-- Texto de Carga y Porcentaje -->
            <div class="flex items-center justify-between w-full text-xs font-semibold tracking-wider text-purple-300/80 px-1">
                <div class="flex items-center space-x-2">
                    <svg class="animate-spin h-3.5 w-3.5 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="loading-text">Cargando...</span>
                </div>
                <span id="progress-percentage" class="font-mono text-purple-400">0%</span>
            </div>
        </div>
    </div>

    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 text-center text-xs text-purple-300/50 hover:text-purple-300 transition-colors">
        <p>Redireccionando automáticamente a la plataforma...</p>
        <div class="mt-1 flex gap-2 justify-center">
            <button onclick="resetLoading()" class="underline hover:text-white text-[11px]">Reiniciar animación</button>
            <span>•</span>
            <button onclick="toggleConfig()" class="underline hover:text-white text-[11px]">Configurar URL de destino</button>
        </div>
    </div>

    <!-- Modal de Configuración Interactiva -->
    <div id="config-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-purple-950/90 border border-purple-500/50 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 class="text-lg font-bold text-purple-200 mb-2">Configurar Redirección</h3>
            <p class="text-xs text-purple-300/70 mb-4">Ingresa la URL a la que se debe ingresar tras los 2 segundos de carga.</p>
            
            <label class="block text-xs font-semibold text-purple-300 mb-1">URL de Destino:</label>
            <input type="text" id="target-url-input" value="https://google.com" class="w-full bg-black/50 border border-purple-500/40 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-400 mb-4 font-mono">
            
            <label class="block text-xs font-semibold text-purple-300 mb-1">Tiempo de Carga (Segundos):</label>
            <input type="number" id="target-time-input" value="2" min="1" max="10" class="w-full bg-black/50 border border-purple-500/40 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-400 mb-5 font-mono">

            <div class="flex justify-end gap-2">
                <button onclick="toggleConfig()" class="px-4 py-2 rounded-lg bg-gray-800 text-xs font-semibold text-gray-300 hover:bg-gray-700">Cancelar</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-xs font-semibold text-white">Guardar y Probar</button>
            </div>
        </div>
    </div>

    <script>
        // Parámetros de configuración iniciales
        let loadingDuration = 2000; // 2 segundos por defecto
        let targetUrl = "https://google.com"; // URL por defecto (cambiar por tu página)
        
        let startTime = null;
        let animationFrameId = null;

        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');
        const loadingText = document.getElementById('loading-text');

        // Función para actualizar la barra de progreso de forma fluida
        function updateProgress(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / loadingDuration, 1);
            
            // Calculamos el porcentaje entero
            const percentage = Math.floor(progress * 100);
            
            // Actualizamos la interfaz
            progressBar.style.width = `${percentage}%`;
            progressPercentage.textContent = `${percentage}%`;

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(updateProgress);
            } else {
                // Proceso de carga completado
                loadingText.textContent = "¡Completado! Entrando...";
                progressBar.style.width = "100%";
                progressPercentage.textContent = "100%";

                // Efecto visual antes de redirigir
                setTimeout(() => {
                    document.getElementById('splash-container').classList.add('transition-all', 'duration-500', 'opacity-0', 'scale-95');
                    setTimeout(() => {
                        // Redirección real de la página
                        if (targetUrl.startsWith('http://') || targetUrl.startsWith('https://')) {
                            window.location.href = targetUrl;
                        } else {
                            // En caso de simulaciones locales
                            console.log("Redirigiendo a: " + targetUrl);
                            window.location.href = targetUrl;
                        }
                    }, 500);
                }, 300);
            }
        }

        // Iniciar la carga al terminar de cargar los elementos de la ventana
        function startLoading() {
            startTime = null;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            loadingText.textContent = "Cargando...";
            document.getElementById('splash-container').classList.remove('opacity-0', 'scale-95');
            animationFrameId = requestAnimationFrame(updateProgress);
        }

        // Reiniciar animación
        function resetLoading() {
            startLoading();
        }

        // Mostrar / Ocultar panel de configuración
        function toggleConfig() {
            const modal = document.getElementById('config-modal');
            modal.classList.toggle('hidden');
        }

        // Guardar parámetros personalizados
        function saveSettings() {
            const urlInput = document.getElementById('target-url-input').value;
            const timeInput = parseFloat(document.getElementById('target-time-input').value);

            if (urlInput) targetUrl = urlInput;
            if (timeInput && timeInput > 0) loadingDuration = timeInput * 1000;

            toggleConfig();
            resetLoading();
        }

        // Ejecutar carga automática al estar listo
        window.onload = function() {
            startLoading();
        };
    </script>
</body>
</html>
